<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>{% if form.instance.id %}Editar{% else %}Nova{% endif %} Planta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1>{% if form.instance.id %}Editar{% else %}Nova{% endif %} Planta - {{ categoria|title }}</h1>
    <form method="post" class="text-center">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Salvar</button>
        <a href="{% url 'RelatorioApp:listar_plantas' categoria %}" class="btn btn-secondary">Voltar</a>
    </form>
</body>
</html>
