<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
   <title>Todos os Cadastros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1>Todos os Cadastros</h1>
    <table class="table table-bordered table-striped mt-3">
        <thead>
            <tr>
                <th>Categoria</th><th>Nome</th><th>Data Plantio</th><th>Adubo</th><th>Fase</th><th>Observação</th>
            </tr>
        </thead>
        <tbody>
        {% for planta in plantas %}
            <tr>
                <td>{{ planta.categoria }}</td>
                <td>{{ planta.nome }}</td>
                <td>{{ planta.data_plantio }}</td>
                <td>{{ planta.adubo }}</td>
                <td>{{ planta.fase }}</td>
                <td>{{ planta.observacao }}</td>
            </tr>
        {% empty %}
            <tr><td colspan="6">Nenhum Cadastro Encontrado!</td></tr>
        {% endfor %}
        </tbody>
    </table>
    <a href="{% url 'EscolherCategoria' %}" class="btn btn-secondary">Voltar</a>
</body>
</html>
